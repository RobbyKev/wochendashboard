<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wochenboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg: #12142b;
    --card: #1c2044;
    --card-hi: #23274f;
    --text: #eef0fb;
    --text-dim: #9498c0;
    --blue: #5b8def;
    --pink: #ec4899;
    --amber: #f5a623;
    --teal: #22d3b6;
    --purple: #a78bfa;
    --sky: #38bdf8;
    --brown: #b08968;
    --grey: #9098b0;
    --line: rgba(255,255,255,0.07);
    --item-font-size: 11.5px;
    --now-color: #ff6b6b;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(ellipse at top left, rgba(91,141,239,0.12), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(236,72,153,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* Header */
  .header{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:18px 18px 12px; gap:10px;
  }
  .header-left{ display:flex; align-items:center; gap:10px; }
  .header-right{ display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  .header-actions{ display:flex; gap:8px; align-items:center; justify-content:center; }
  .clock{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; padding:6px 10px;
  }
  .flip-row{ display:flex; align-items:center; gap:3px; }
  .flip-digit{
    position:relative; width:44px; height:60px; perspective:200px;
  }
  .flip-digit .value{
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%; background:var(--card-hi); color:var(--text);
    font-family:'Inter', monospace; font-size:38px; font-weight:800; border-radius:8px;
    border:1px solid var(--line); box-shadow:0 3px 0 rgba(0,0,0,0.3);
  }
  .flip-digit .value:after{
    content:''; position:absolute; left:0; right:0; top:50%; height:1px;
    background:rgba(0,0,0,0.4);
  }
  @keyframes flipAnim{
    0%{ transform:rotateX(0deg); }
    50%{ transform:rotateX(-90deg); }
    100%{ transform:rotateX(0deg); }
  }
  .flip-digit.flipping .value{ animation:flipAnim 0.4s ease-in-out; }
  .flip-colon{ font-size:34px; font-weight:800; color:var(--text-dim); padding:0 1px; }
  .flip-date{ font-size:13.5px; color:var(--text-dim); font-weight:600; white-space:nowrap; }
  .clock:hover .value{ border-color:var(--blue); }

  /* Vollbild-Uhr */
  .fs-clock-overlay{
    position:fixed; inset:0; background:var(--bg); z-index:100; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:24px;
  }
  .fs-clock-overlay.open{ display:flex; }
  .fs-close-btn{
    position:absolute; top:20px; right:20px; background:var(--card); border:1px solid var(--line);
    color:var(--text-dim); font-size:20px; cursor:pointer; width:44px; height:44px; border-radius:50%;
  }
  .fs-close-btn:hover{ color:var(--text); border-color:var(--pink); }
  .fs-tabs{ display:flex; gap:10px; margin-bottom:10px; }
  .fs-tab{
    background:var(--card); border:1px solid var(--line); color:var(--text-dim); font-size:14px; font-weight:700;
    padding:10px 22px; border-radius:20px; cursor:pointer;
  }
  .fs-tab.active{ background:var(--blue); color:#0d0f22; border-color:var(--blue); }
  .fs-flip-row{ display:flex; align-items:center; gap:10px; }
  .fs-flip-digit{ position:relative; width:110px; height:150px; perspective:400px; }
  .fs-flip-digit .value{
    display:flex; align-items:center; justify-content:center; width:100%; height:100%;
    background:var(--card-hi); color:var(--text); font-family:'Inter', monospace; font-size:96px; font-weight:800;
    border-radius:16px; border:1px solid var(--line); box-shadow:0 6px 0 rgba(0,0,0,0.3);
  }
  .fs-flip-digit .value:after{ content:''; position:absolute; left:0; right:0; top:50%; height:2px; background:rgba(0,0,0,0.4); }
  .fs-flip-digit.flipping .value{ animation:flipAnim 0.4s ease-in-out; }
  .fs-flip-colon{ font-size:80px; font-weight:800; color:var(--text-dim); }
  .fs-date{ font-size:22px; color:var(--text-dim); font-weight:600; }

  .timer-display{ font-size:100px; font-weight:800; font-family:'Inter', monospace; color:var(--text); }
  .timer-display.done{ color:#ff6b6b; animation:w-flash 1s infinite; }
  .timer-controls{ display:flex; gap:12px; align-items:center; }
  .timer-input{
    width:90px; text-align:center; font-size:20px; padding:10px; background:var(--card); color:var(--text);
    border:1px solid var(--line); border-radius:10px; font-family:'Inter', sans-serif;
  }
  .timer-btn{
    background:var(--blue); color:#0d0f22; border:none; border-radius:12px; padding:14px 26px;
    font-size:16px; font-weight:700; cursor:pointer;
  }
  .timer-btn.secondary{ background:var(--card); color:var(--text); border:1px solid var(--line); }

  /* Wetter-Kachel */
  .weather-tile{
    display:flex; align-items:center; gap:8px; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px 12px;
  }
  .weather-tile:hover{ border-color:var(--blue); }
  .weather-temp-big{ font-size:30px; font-weight:800; color:var(--blue); }
  .weather-desc{ font-size:14px; color:var(--text-dim); font-weight:500; }
  .weather-meta{ font-size:12px; color:var(--text-dim); margin-left:auto; text-align:right; line-height:1.5; }

  /* Animierte Wetter-Icons */
  #weather_icon_slot{
    width:80px; height:80px; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .wicon{
    position:relative; display:inline-block; width:12em; height:10em;
    font-size:6.6px; flex-shrink:0;
    animation: w-float 3s ease-in-out infinite;
  }
  @keyframes w-float{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }
  .wicon.sunny, .wicon.sun-shower{ color:var(--amber); }
  .wicon.cloudy{ color:var(--text-dim); }
  .wicon.rainy, .wicon.sun-shower{ color:var(--sky); }
  .wicon.sun-shower .w-sun{ color:var(--amber); }
  .wicon.thunder-storm{ color:#8a8fa8; }
  .wicon.flurries{ color:#b8c4d9; }

  .w-cloud{
    position:absolute; z-index:1; top:50%; left:50%;
    width:3.6875em; height:3.6875em; margin:-1.84375em;
    background:currentColor; border-radius:50%;
    box-shadow:
      -2.1875em 0.6875em 0 -0.6875em,
      2.0625em 0.9375em 0 -0.9375em,
      0 0 0 0.375em var(--card),
      -2.1875em 0.6875em 0 -0.3125em var(--card),
      2.0625em 0.9375em 0 -0.5625em var(--card);
  }
  .w-cloud:after{
    content:''; position:absolute; bottom:0; left:-0.5em; display:block;
    width:4.5625em; height:1em; background:currentColor;
    box-shadow:0 0.4375em 0 -0.0625em var(--card);
  }
  .w-cloud:nth-child(2){
    z-index:0; background:var(--card);
    box-shadow:
      -2.1875em 0.6875em 0 -0.6875em var(--card),
      2.0625em 0.9375em 0 -0.9375em var(--card),
      0 0 0 0.375em var(--card),
      -2.1875em 0.6875em 0 -0.3125em var(--card),
      2.0625em 0.9375em 0 -0.5625em var(--card);
    opacity:0.5; transform:scale(0.5) translate(6em, -3em);
    animation:w-cloud-drift 4s linear infinite;
  }
  .w-cloud:nth-child(2):after{ background:var(--card); }

  .w-sun{
    position:absolute; top:50%; left:50%; width:2.5em; height:2.5em; margin:-1.25em;
    background:currentColor; border-radius:50%; box-shadow:0 0 0 0.375em var(--card);
    animation:w-spin 12s infinite linear;
  }
  .w-rays{
    position:absolute; top:-2em; left:50%; display:block; width:0.375em; height:1.125em;
    margin-left:-0.1875em; background:currentColor; border-radius:0.25em; box-shadow:0 5.375em currentColor;
  }
  .w-rays:before, .w-rays:after{
    content:''; position:absolute; top:0; left:0; display:block; width:0.375em; height:1.125em;
    transform:rotate(60deg); transform-origin:50% 3.25em; background:currentColor; border-radius:0.25em;
    box-shadow:0 5.375em currentColor;
  }
  .w-rays:before{ transform:rotate(120deg); }
  .w-cloud + .w-sun{ margin:-2em 1em; }

  .w-rain{
    position:absolute; z-index:2; top:50%; left:50%; width:3.75em; height:3.75em; margin:0.375em 0 0 -2em;
  }
  .w-rain:after{
    content:''; position:absolute; z-index:2; top:50%; left:50%; width:1.125em; height:1.125em;
    margin:-1em 0 0 -0.25em; background:var(--sky); border-radius:100% 0 60% 50% / 60% 0 100% 50%;
    box-shadow:
      0.625em 0.875em 0 -0.125em rgba(255,255,255,0.25),
      -0.875em 1.125em 0 -0.125em rgba(255,255,255,0.25),
      -1.375em -0.125em 0 rgba(255,255,255,0.25);
    transform:rotate(-28deg); animation:w-rain-fall 3s linear infinite;
  }

  .w-lightning{
    position:absolute; z-index:2; top:50%; left:50%; width:3.75em; height:3.75em; margin:0.375em 0 0 -2em;
  }
  .w-bolt{
    position:absolute; top:50%; left:50%; margin:-0.25em 0 0 -0.125em; color:#ffd93d; opacity:0.4;
    animation:w-flash 2s linear infinite;
  }
  .w-bolt:nth-child(2){
    width:0.5em; height:0.25em; margin:-1.75em 0 0 -1.875em; transform:translate(2.5em, 2.25em);
    opacity:0.3; animation:w-flash 1.5s linear infinite;
  }
  .w-bolt:before, .w-bolt:after{
    content:''; position:absolute; z-index:2; top:50%; left:50%; margin:-1.625em 0 0 -1.0125em;
    border-top:1.25em solid transparent; border-right:0.75em solid; border-bottom:0.75em solid;
    border-left:0.5em solid transparent; transform:skewX(-10deg);
  }
  .w-bolt:after{
    margin:-0.25em 0 0 -0.25em; border-top:0.75em solid; border-right:0.5em solid transparent;
    border-bottom:1.25em solid transparent; border-left:0.75em solid; transform:skewX(-10deg);
  }

  .w-snow{
    position:absolute; z-index:2; top:50%; left:50%; width:3.75em; height:3.75em; margin:0.375em 0 0 -2em;
  }
  .w-flake:before, .w-flake:after{
    content:'\2744'; position:absolute; top:50%; left:50%; margin:-1.025em 0 0 -1.0125em;
    color:currentColor; opacity:0.6; animation:w-sway 3.2s ease-in-out infinite; font-size:1em;
  }
  .w-flake:after{
    margin:0.125em 0 0 -1em; font-size:1.5em; opacity:0.8; animation:w-sway 4.2s ease-in-out infinite;
  }
  .w-flake:nth-child(2):before{
    margin:-0.5em 0 0 0.25em; font-size:1.25em; opacity:0.6; animation:w-sway 3.7s ease-in-out infinite reverse;
  }
  .w-flake:nth-child(2):after{
    margin:0.375em 0 0 0.125em; font-size:2em; opacity:0.8; animation:w-sway 4.8s ease-in-out infinite reverse;
  }

  @keyframes w-sway{
    0%, 100%{ transform:translateX(-0.3em) rotate(-10deg); }
    50%{ transform:translateX(0.3em) rotate(10deg); }
  }
  @keyframes w-spin{ 100%{ transform:rotate(360deg); } }
  @keyframes w-spin-rev{ 100%{ transform:rotate(-360deg); } }
  @keyframes w-cloud-drift{
    0%{ opacity:0; } 50%{ opacity:0.7; } 100%{ opacity:0; transform:scale(0.6) translate(-220%, -3em); }
  }
  @keyframes w-rain-fall{
    0%{ background:var(--sky); box-shadow:0.625em 0.875em 0 -0.125em rgba(255,255,255,0.25), -0.875em 1.125em 0 -0.125em rgba(255,255,255,0.25), -1.375em -0.125em 0 var(--sky); }
    25%{ box-shadow:0.625em 0.875em 0 -0.125em rgba(255,255,255,0.25), -0.875em 1.125em 0 -0.125em var(--sky), -1.375em -0.125em 0 rgba(255,255,255,0.25); }
    50%{ background:rgba(255,255,255,0.3); box-shadow:0.625em 0.875em 0 -0.125em var(--sky), -0.875em 1.125em 0 -0.125em rgba(255,255,255,0.25), -1.375em -0.125em 0 rgba(255,255,255,0.25); }
    100%{ box-shadow:0.625em 0.875em 0 -0.125em rgba(255,255,255,0.25), -0.875em 1.125em 0 -0.125em rgba(255,255,255,0.25), -1.375em -0.125em 0 var(--sky); }
  }
  @keyframes w-flash{
    45%{ color:#fff; background:#fff; opacity:0.2; }
    50%{ color:#ffd93d; background:#ffd93d; opacity:1; }
    55%{ color:#fff; background:#fff; opacity:0.2; }
  }

  /* Zentraler Plus-Button */
  .add-fab{
    width:44px; height:44px; border-radius:50%; background:var(--blue); color:#0d0f22;
    border:none; font-size:22px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(91,141,239,0.35); flex-shrink:0;
  }
  .add-fab:hover{ filter:brightness(1.08); }
  .unplanned-fab{
    position:relative; width:44px; height:44px; border-radius:50%; background:var(--purple); color:#0d0f22;
    border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 4px 14px rgba(167,139,250,0.35);
  }
  .unplanned-fab:hover{ filter:brightness(1.08); }
  .unplanned-fab svg{ width:20px; height:20px; }
  .unplanned-badge{
    position:absolute; top:-4px; right:-4px; background:#ff6b6b; color:#fff; font-size:10.5px; font-weight:800;
    min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    padding:0 4px; border:2px solid var(--bg);
  }
  .unplanned-row{
    margin-bottom:10px; padding-right:46px !important; font-size:14px !important;
  }
  .unplanned-assign{
    position:absolute; top:6px; right:24px; color:var(--blue); font-size:16px; font-weight:800;
    cursor:pointer; padding:3px 6px; line-height:1;
  }
  .tpl-corner-btn{
    position:absolute; top:16px; right:60px; width:32px; height:32px; border-radius:50%;
    background:#6983b8; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:#0d0f22;
  }
  .tpl-corner-btn:hover{ filter:brightness(1.1); }
  .tpl-corner-btn svg{ width:16px; height:16px; }
  .import-corner-btn{
    position:absolute; top:16px; right:100px; width:32px; height:32px; border-radius:50%;
    background:var(--sky); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:#0d0f22;
  }
  .import-corner-btn:hover{ filter:brightness(1.1); }
  .import-corner-btn svg{ width:16px; height:16px; }
  .import-textarea{
    width:100%; min-height:220px; font-size:13px; padding:11px 12px; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:10px; font-family:'Inter', sans-serif; resize:vertical;
  }

  /* Layout */
  .layout{ padding:8px 24px 28px; }
  .card{
    position:relative;
    background: var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }

  /* Wochenboard */
  .view-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .view-toggle-btn{
    background:var(--bg); border:1px solid var(--line); color:var(--text-dim); font-size:13px; font-weight:700;
    padding:9px 18px; border-radius:10px; cursor:pointer;
  }
  .view-toggle-btn.active{ background:var(--blue); color:#0d0f22; border-color:var(--blue); }

  .tl-day-tabs{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tl-day-tab{
    background:var(--bg); border:1px solid var(--line); color:var(--text-dim); font-size:12.5px; font-weight:700;
    padding:7px 14px; border-radius:9px; cursor:pointer;
  }
  .tl-day-tab.active{ background:var(--blue); color:#0d0f22; border-color:var(--blue); }
  .tl-untimed{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tl-untimed .list-item{ flex:0 0 auto; min-width:150px; max-width:220px; }
  .tl-scroll{ display:flex; gap:8px; max-height:640px; overflow-y:auto; position:relative; }
  .tl-gutter{ position:relative; width:34px; flex-shrink:0; }
  .tl-hour-label{ position:absolute; right:4px; transform:translateY(-50%); font-size:10.5px; color:var(--text-dim); font-weight:600; }
  .tl-day-col{ position:relative; flex:1; background:var(--bg); border:1px solid var(--line); border-radius:12px; }
  .tl-hour-line{ position:absolute; left:0; right:0; border-top:1px solid var(--line); }
  .tl-item{
    position:absolute; left:4px; right:4px; border-radius:8px; background:var(--card-hi);
    border-left:3px solid var(--blue); overflow:hidden; touch-action:none; box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  .tl-item.done{ opacity:0.5; }
  .tl-item.done .tl-item-body{ text-decoration:line-through; }
  .tl-item-body{
    padding:4px 8px; font-size:12px; line-height:1.3; cursor:grab; height:100%; box-sizing:border-box;
    overflow:hidden; color:var(--text);
  }
  .tl-item-time{ font-weight:700; color:var(--text-dim); margin-right:4px; font-size:10.5px; }
  .tl-resize-handle{ position:absolute; left:0; right:0; bottom:0; height:12px; cursor:ns-resize; touch-action:none; }
  .tl-resize-handle:after{
    content:''; position:absolute; left:50%; bottom:3px; width:26px; height:3px;
    background:var(--text-dim); border-radius:2px; transform:translateX(-50%); opacity:0.5;
  }

  .board-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:6px;
  }
  @media (max-width: 720px){
    .board-grid{ grid-template-columns:repeat(2,1fr); }
  }
  .day-col{
    background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:8px 6px;
    display:flex; flex-direction:column; gap:5px; min-height:140px;
    transition:opacity 0.3s ease, transform 0.3s ease;
  }
  .day-col.today{
    border-color:var(--blue); box-shadow:0 0 0 1px var(--blue) inset, 0 6px 18px rgba(91,141,239,0.25);
    opacity:1; transform:scale(1.035); z-index:2; position:relative;
  }
  .day-col.day-future{ opacity:0.78; }
  .day-col.day-past{ opacity:0.45; }
  .day-col.dragover{ border-color:var(--pink); background:var(--card-hi); opacity:1; }
  .day-header{
    text-align:center; font-size:12px; font-weight:700; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:0.05em; padding-bottom:6px; border-bottom:1px solid var(--line); margin-bottom:2px;
  }
  .day-header.today{ color:var(--blue); }
  .time-group-section{ min-height:6px; }
  .time-group-items{ display:flex; flex-direction:column; gap:5px; }
  .untimed-spacer{ height:1px; margin:4px 4px 3px; border-top:1px dashed var(--line); }
  .now-line{
    display:flex; align-items:center; gap:6px; margin:3px 2px;
  }
  .now-line::before{
    content:''; width:6px; height:6px; border-radius:50%; background:var(--now-color); flex-shrink:0;
  }
  .now-line::after{
    content:''; flex:1; height:1px; background:var(--now-color); opacity:0.5;
  }
  .no-group-items{ display:flex; flex-direction:column; gap:5px; margin-top:4px; }
  .routine-bar{
    display:flex; align-items:center; gap:5px; margin-top:6px; padding:6px 8px;
    background:var(--card-hi); border-radius:8px; cursor:pointer; font-size:10.5px; font-weight:700;
    color:var(--text-dim); opacity:0.85;
  }
  .routine-bar:hover{ opacity:1; }
  .routine-bar-icon{ font-size:10px; }
  .routine-bar-arrow{ margin-left:auto; font-size:9px; }
  .routine-expanded{ display:flex; flex-direction:column; gap:5px; margin-top:5px; }
  .time-group-label{
    font-size:9px; font-weight:700; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:0.06em; margin:4px 2px 3px 2px; opacity:0.65;
  }
  .time-group-section:first-of-type .time-group-label{ margin-top:0; }
  .list-item{
    background:var(--card-hi); border-radius:9px; padding:6px 22px 6px 8px; position:relative;
    font-size:var(--item-font-size); line-height:1.3; border-left:3px solid var(--blue); cursor:grab;
    white-space:normal; word-break:break-word;
  }
  .list-item.dragging{ opacity:0.4; }

<script>
/* ================= Grunddaten ================= */
const DAYS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const DAY_FULL = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const STORAGE_KEY = "wochenboard_data";
const CATEGORIES = [
  {key:'haushalt', label:'Haushalt', color:'blue'},
  {key:'garten', label:'Garten', color:'amber'},
  {key:'theo', label:'Theo', color:'brown'},
  {key:'termine', label:'Termine', color:'sky'},
  {key:'pause', label:'Pause', color:'teal'},
  {key:'projekte', label:'Projekte', color:'pink'},
  {key:'sonstiges', label:'Sonstiges', color:'grey'}
];
function catByKey(key){ return CATEGORIES.find(c=>c.key===key) || null; }
function dowIndex(){
  const j = new Date().getDay();
  return j === 0 ? 6 : j-1;
}

/* ================= Firebase / Firestore ================= */
const firebaseConfig = {
  apiKey: "AIzaSyA9TNbN9wsAh8_5lKV7BG_yb40Dggzp9HM",
  authDomain: "wochenplaner-d2b8a.firebaseapp.com",
  projectId: "wochenplaner-d2b8a",
  storageBucket: "wochenplaner-d2b8a.firebasestorage.app",
  messagingSenderId: "928312248897",
  appId: "1:928312248897:web:8bec731c72d7f180ed14c0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function freshBoard(){ const b = {}; DAYS.forEach(d=>b[d]=[]); b.unplanned = []; b.todos = []; return b; }
function ensureUnplanned(board){ return ensureBuckets(board); }
function ensureBuckets(board){
  if(!board.unplanned) board.unplanned = [];
  if(!board.todos) board.todos = [];
  return board;
}
let boardCache = freshBoard();
let boardLoaded = false;

/* ================= Speicher (Firestore, live-synchron) ================= */
function getBoard(){
  return boardCache;
}
function saveBoard(board){
  boardCache = board;
  db.collection('wochendashboard').doc('board').set({ data: board }).catch(e => console.error('Speichern fehlgeschlagen:', e));
}
db.collection('wochendashboard').doc('board').onSnapshot(doc => {
  boardCache = (doc.exists && doc.data().data) ? doc.data().data : freshBoard();
  ensureUnplanned(boardCache);
  checkWeekRollover();
  boardLoaded = true;
  renderBoard();
}, err => console.error('Firestore-Fehler (Board):', err));

/* ================= Wochenwechsel ================= */
function getMondayKey(d){
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // Mo=0
  date.setDate(date.getDate() - day);
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const dd = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
function checkWeekRollover(){
  const currentMonday = getMondayKey(new Date());
  const board = ensureUnplanned(boardCache);
  const lastSeen = board.weekKey || null;
  if(lastSeen === currentMonday) return; // gleiche Woche (für alle Geräte gemeinsam), nichts zu tun

  if(!lastSeen){
    // allererster Rollover-Check überhaupt (Board hat noch keinen weekKey) -> nur merken, nichts verschieben
    board.weekKey = currentMonday;
    saveBoard(board);
    return;
  }

  let changed = false;
  DAYS.forEach(day => {
    const items = board[day] || [];
    const stillOpen = items.filter(it => {
      const obj = (typeof it === 'string') ? {text: it} : it;
      return !obj.done;
    });
    if(items.length > 0){
      changed = true;
      board.unplanned = board.unplanned.concat(stillOpen);
      board[day] = [];
    }
  });
  board.weekKey = currentMonday;

let lastFlipDigits = ['-','-','-','-'];
function tickClock(){
  const now = new Date();
  const dateEl = document.getElementById('flip_date');
  if(dateEl){
    dateEl.textContent = now.toLocaleDateString('de-DE',{weekday:'long', day:'2-digit', month:'2-digit'});
  }

  if(fsDateEl){
    fsDateEl.textContent = now.toLocaleDateString('de-DE',{weekday:'long', day:'2-digit', month:'2-digit'});
  }
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const digits = (hh + mm).split('');

  ['.flip-digit', '.fs-flip-digit'].forEach(selector => {
    const digitEls = document.querySelectorAll(selector);
    digitEls.forEach((el, i) => {
      const valueEl = el.querySelector('.value');
      if(!valueEl) return;
      if(lastFlipDigits[i] !== digits[i]){
        el.classList.add('flipping');
        setTimeout(() => { valueEl.textContent = digits[i]; }, 180);
        setTimeout(() => { el.classList.remove('flipping'); }, 400);
      }
    });
  });
  lastFlipDigits = digits;
}

let timerInterval = null;
let timerSecondsLeft = 0;
let audioCtx = null;
function unlockAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ console.error('Audio nicht verfügbar:', e); }
  }
}
function playBeep(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  [0, 0.35, 0.7].forEach(offset => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, now + offset);
    gain.gain.exponentialRampToValueAtTime(0.3, now + offset + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + offset);
    osc.stop(now + offset + 0.3);
  });
}
function playCheckSound(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  [ {f:520, t:0}, {f:780, t:0.07} ].forEach(({f,t}) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    gain.gain.setValueAtTime(0.0001, now + t);
    gain.gain.exponentialRampToValueAtTime(0.15, now + t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.13);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + t);
    osc.stop(now + t + 0.15);
  });
}
function formatTimer(sec){
  const m = Math.floor(sec / 60).toString().padStart(2,'0');
  const s = Math.floor(sec % 60).toString().padStart(2,'0');
  return `${m}:${s}`;
}
function startTimer(){
  unlockAudio();
  if(timerInterval) return; // läuft schon
  if(timerSecondsLeft <= 0){
    const mins = parseFloat(document.getElementById('timer_minutes').value) || 5;
    timerSecondsLeft = Math.round(mins * 60);
  }
  document.getElementById('timer_display').classList.remove('done');
  document.getElementById('timer_setup').style.display = 'none';
  document.getElementById('timer_start_btn').textContent = 'Pause';
  document.getElementById('timer_start_btn').onclick = pauseTimer;
  timerInterval = setInterval(() => {
    timerSecondsLeft--;
    document.getElementById('timer_display').textContent = formatTimer(Math.max(timerSecondsLeft,0));
    if(timerSecondsLeft <= 0){
      clearInterval(timerInterval);
      timerInterval = null;
      document.getElementById('timer_display').classList.add('done');
      document.getElementById('timer_start_btn').textContent = 'Start';
      document.getElementById('timer_start_btn').onclick = startTimer;
      playBeep();
    }
  }, 1000);
  document.getElementById('timer_display').textContent = formatTimer(timerSecondsLeft);
}
function pauseTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  document.getElementById('timer_start_btn').textContent = 'Weiter';
  document.getElementById('timer_start_btn').onclick = startTimer;
}
function resetTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  timerSecondsLeft = 0;
  document.getElementById('timer_display').classList.remove('done');
  document.getElementById('timer_display').textContent = (document.getElementById('timer_minutes').value || 5).toString().padStart(2,'0') + ':00';
  document.getElementById('timer_setup').style.display = 'flex';
  document.getElementById('timer_start_btn').textContent = 'Start';
  document.getElementById('timer_start_btn').onclick = startTimer;
}

function renderMonth(year, month){
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const todayStr = new Date().toDateString();
  const monthNames = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

  let cells = '';
  for(let i=startOffset; i>0; i--){
    cells += `<div class="cal-day other-month">${daysInPrevMonth - i + 1}</div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const cellDate = new Date(year, month, d);
    const isToday = cellDate.toDateString() === todayStr;
    cells += `<div class="cal-day ${isToday?'today':''}">${d}</div>`;
  }
  const totalCells = startOffset + daysInMonth;
  const remainder = (7 - (totalCells % 7)) % 7;
  for(let d=1; d<=remainder; d++){
    cells += `<div class="cal-day other-month">${d}</div>`;
  }
  const weekdayLabels = DAYS.map(w=>`<div class="cal-weekday">${w}</div>`).join('');

  openModal(`
    <h2>${monthNames[month]} ${year}</h2>
    <p style="color:var(--text-dim); font-size:13px; margin:6px 0 0;">Reine Übersicht.</p>
    <div class="cal-grid">${weekdayLabels}${cells}</div>
  `);
}

function windArrow(deg){

const TEMP_COLOR_STOPS = [
  {t: 0,  c: [56, 189, 248]},  // Himmelblau (kalt)
  {t: 15, c: [107, 203, 119]}, // Grün (mild)
  {t: 22, c: [245, 166, 35]},  // Amber (warm)
  {t: 30, c: [255, 107, 107]}  // Rot (heiß)
];
function tempToColor(temp){
  const stops = TEMP_COLOR_STOPS;
  if(temp <= stops[0].t) return `rgb(${stops[0].c.join(',')})`;
  if(temp >= stops[stops.length-1].t) return `rgb(${stops[stops.length-1].c.join(',')})`;
  for(let i = 0; i < stops.length - 1; i++){
    const a = stops[i], b = stops[i+1];
    if(temp >= a.t && temp <= b.t){
      const ratio = (temp - a.t) / (b.t - a.t);
      const c = a.c.map((v, idx) => Math.round(v + (b.c[idx] - v) * ratio));
      return `rgb(${c.join(',')})`;
    }
  }
  return `rgb(${stops[stops.length-1].c.join(',')})`;
}
function weatherIconType(code){
  if(code === 0 || code === 1) return 'sunny';
  if(code === 2) return 'cloudy';
  if(code === 3) return 'cloudy';
  if(code === 45 || code === 48) return 'cloudy';
  if([51,61,80].includes(code)) return 'sun-shower';
  if([63,65,81].includes(code)) return 'rainy';
  if([71,73].includes(code)) return 'flurries';
  if(code === 95) return 'thunder-storm';
  return 'cloudy';
}
function animatedWeatherIcon(code){
  const type = weatherIconType(code);
  const parts = {
    'sunny': `<div class="w-sun"><div class="w-rays"></div></div>`,
    'cloudy': `<div class="w-cloud"></div><div class="w-cloud"></div>`,
    'rainy': `<div class="w-cloud"></div><div class="w-rain"></div>`,
    'sun-shower': `<div class="w-cloud"></div><div class="w-sun"><div class="w-rays"></div></div><div class="w-rain"></div>`,
    'thunder-storm': `<div class="w-cloud"></div><div class="w-lightning"><div class="w-bolt"></div><div class="w-bolt"></div></div>`,
    'flurries': `<div class="w-cloud"></div><div class="w-snow"><div class="w-flake"></div><div class="w-flake"></div></div>`
  };
  return `<div class="wicon ${type}">${parts[type] || parts['cloudy']}</div>`;
}
function weatherIcon(code){
  if(code === 0 || code === 1) return '☀️';
  if(code === 2) return '⛅';
  if(code === 3) return '☁️';
  if(code === 45 || code === 48) return '🌫️';

  if(code === 95) return '⛈️';

}

let dragSrc = null;
let routineExpandedDays = {};
function toggleRoutineExpand(day){
  routineExpandedDays[day] = !routineExpandedDays[day];
  renderBoard();
}

const TIME_GROUPS = [
  {key:'morgens', label:'Morgens', from:5, to:12, always:true},
  {key:'mittags', label:'Mittags', from:12, to:17, always:true},
  {key:'abends', label:'Abends', from:17, to:24, always:true},
  {key:'nachts', label:'Nachts', from:0, to:5, always:false}
];
function getTimeGroup(timeStr){
  if(!timeStr) return null;
  const h = parseInt(timeStr.split(':')[0], 10);
  return TIME_GROUPS.find(g => h >= g.from && h < g.to) || null;
}
function getEffectiveGroup(item){
  if(item.period){
    const g = TIME_GROUPS.find(g => g.key === item.period);
    if(g) return g;
  }
  if(item.time) return getTimeGroup(item.time);
  return null;
}

function renderBoard(){
  const board = getBoard();
  const todayIdx = dowIndex();
  const todayKey = DAYS[todayIdx];
  const nowStr = new Date().toTimeString().slice(0,5);
  const currentPeriod = getTimeGroup(nowStr);

  const html = DAYS.map((day, i) => {
    const rawItems = board[day] || [];
    const allItems = rawItems.map((it, origIdx) => {
      const obj = (typeof it === 'string') ? {text: it} : it;
      return Object.assign({}, obj, {origIdx});
    });

    const isFuture = i > todayIdx;
    const routineItems = isFuture ? allItems.filter(it => it.routine) : [];
    const items = isFuture ? allItems.filter(it => !it.routine) : allItems;

    let sectionsHtml = '';
    TIME_GROUPS.forEach(g => {
      const inGroup = items.filter(it => {
        const eff = getEffectiveGroup(it);
        return eff && eff.key === g.key;
      });
      if(!g.always && inGroup.length === 0) return;

      const timed = inGroup.filter(it => it.time);
      const untimed = inGroup.filter(it => !it.time);

      let timedHtml = '';
      const showNowLine = (i === todayIdx) && currentPeriod && currentPeriod.key === g.key;
      let nowLineInserted = false;
      timed.forEach(obj => {
        if(showNowLine && !nowLineInserted && obj.time > nowStr){
          timedHtml += `<div class="now-line"></div>`;
          nowLineInserted = true;
        }
        timedHtml += renderItemHtml(obj, day);
      });
      if(showNowLine && !nowLineInserted){
        timedHtml += `<div class="now-line"></div>`;
      }

      const untimedHtml = untimed.map(obj => renderItemHtml(obj, day)).join('');
      const spacer = (timed.length > 0 && untimed.length > 0) ? `<div class="untimed-spacer"></div>` : '';
      const itemsHtml = timedHtml + spacer + untimedHtml;

      sectionsHtml += `
        <div class="time-group-section" data-day="${day}" data-group="${g.key}"
          ondragover="onGroupDragOver(event)" ondrop="onGroupDrop(event, '${day}', '${g.key}')">
          <div class="time-group-label">${g.label}</div>
          <div class="time-group-items">${itemsHtml}</div>
        </div>
      `;
    });

    const noGroupItems = items.filter(it => !getEffectiveGroup(it));
    if(noGroupItems.length > 0){
      sectionsHtml += `<div class="no-group-items">${noGroupItems.map(obj => renderItemHtml(obj, day)).join('')}</div>`;
    }

    if(routineItems.length > 0){
      const expanded = !!routineExpandedDays[day];
      sectionsHtml += `
        <div class="routine-bar" onclick="toggleRoutineExpand('${day}')">
          <span class="routine-bar-icon">🔄</span> ${routineItems.length} Routine${routineItems.length > 1 ? 'n' : ''}
          <span class="routine-bar-arrow">${expanded ? '▲' : '▼'}</span>
        </div>
      `;
      if(expanded){
        sectionsHtml += `<div class="routine-expanded">${routineItems.map(obj => renderItemHtml(obj, day)).join('')}</div>`;
      }
    }

    const dayRelClass = i === todayIdx ? 'today' : (i < todayIdx ? 'day-past' : 'day-future');
    return `
      <div class="day-col ${dayRelClass}" data-day="${day}"
        ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <div class="day-header ${i === todayIdx ? 'today' : ''}">${DAY_FULL[i].slice(0,2)}</div>
        ${sectionsHtml}
      </div>
    `;
  }).join('');

  document.getElementById('board_grid').innerHTML = html;

  const todayItems = board[todayKey] || [];
  const todayDone = todayItems.filter(it => typeof it === 'object' && it.done).length;
  updateProgress(todayItems.length, todayDone);
  updateUnplannedBadge();
  if(boardViewMode === 'timeline') renderTimelineView();
}
function onGroupDragOver(e){ e.preventDefault(); e.stopPropagation(); }
function onGroupDrop(e, targetDay, groupKey){
  e.preventDefault();
  e.stopPropagation();
  if(!dragSrc) return;
  const board = getBoard();
  const [moved] = board[dragSrc.day].splice(dragSrc.idx, 1);
  moved.period = groupKey;
  board[targetDay].push(moved);
  saveBoard(board);
  dragSrc = null;
  renderBoard();
}
function updateProgress(total, done){
  const numEl = document.getElementById('progress_num');
  const barEl = document.getElementById('progress_bar');
  if(!numEl || !barEl) return;
  numEl.textContent = `${done}/${total}`;
  barEl.style.width = total === 0 ? '0%' : Math.round((done/total)*100) + '%';
}
function updateUnplannedBadge(){

  updateBadge('unplanned_badge', board.unplanned.length);
  updateBadge('todo_badge', board.todos.length);
}
function updateBadge(id, count){
  const badge = document.getElementById(id);
  if(!badge) return;
  if(count > 0){
    badge.textContent = count > 99 ? '99+' : count;
    badge.style.display = 'flex';

function getDisplayText(obj){
  if(obj.templateId){
    const tpl = templatesCache.find(t => t.id === obj.templateId);
    if(tpl){
      if(obj.done) return tpl.name;
      const idx = Math.min(obj.stepIndex || 0, tpl.steps.length - 1);
      return tpl.steps[idx];
    }
  }
  return obj.text;
}
function renderItemHtml(obj, day){
  const cat = catByKey(obj.category);
  const borderColor = cat ? `var(--${cat.color})` : 'var(--blue)';
  const timeLabel = obj.time ? `<span class="item-time">${obj.time}</span>` : '';
  const recurLabel = obj.recurring ? `<span class="recur-icon">🔁</span>` : '';
  const prioDot = obj.priority ? `<span class="prio-dot ${obj.priority}"></span>` : '';
  const tplLabel = obj.templateId ? `<span class="tpl-icon">${REPEAT_ICON_SVG}</span>` : '';
  const eff = getEffectiveGroup(obj);
  const effKey = eff ? eff.key : '';
  const displayText = getDisplayText(obj);
  const highClass = (obj.priority === 'high' && !obj.done)
    ? 'prio-high-outline'
    : (obj.category === 'termine' && !obj.done) ? 'cat-termine-outline'
    : (obj.category === 'pause' && !obj.done) ? 'cat-pause-outline' : '';
  return `
    <div class="list-item ${obj.done ? 'done' : ''} ${highClass}" style="border-left-color:${borderColor}" draggable="true"
      data-day="${day}" data-idx="${obj.origIdx}"
      ondragstart="onDragStart(event)" ondragend="onDragEnd(event)"
      ondragover="onItemDragOver(event)" ondrop="onItemDrop(event, '${day}', ${obj.origIdx}, '${effKey}')"
      onclick="handleItemTap(event, '${day}', ${obj.origIdx})">
      ${prioDot}${recurLabel}${tplLabel}${timeLabel}${escapeHtml(displayText)}<span class="del" onclick="event.stopPropagation(); openEditModal('${day}', ${obj.origIdx})">✎</span>
    </div>
  `;
}
const lastTapMap = {};
function handleItemTap(e, day, idx){
  const key = day + '-' + idx;
  const now = Date.now();
  if(lastTapMap[key] && (now - lastTapMap[key]) < 400){
    delete lastTapMap[key];
    toggleDone(day, idx);
  } else {
    lastTapMap[key] = now;
  }
}
function toggleDone(day, idx){
  const board = getBoard();
  let item = board[day][idx];
  if(typeof item === 'string'){
    item = {text: item};
    board[day][idx] = item;
  }
  const wasDone = !!item.done;
  const tpl = item.templateId ? templatesCache.find(t => t.id === item.templateId) : null;
  if(tpl){
    if(item.done){
      item.done = false;
    } else if((item.stepIndex || 0) < tpl.steps.length - 1){
      item.stepIndex = (item.stepIndex || 0) + 1;
    } else {
      item.done = true;
    }
  } else {
    item.done = !item.done;
  }
  if(!wasDone && item.done){
    unlockAudio();
    playCheckSound();
  }
  saveBoard(board);
  renderBoard();
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let draggingFromUnplanned = false;
function onDragStart(e){
  dragSrc = { day: e.currentTarget.dataset.day, idx: parseInt(e.currentTarget.dataset.idx, 10) };
  e.currentTarget.classList.add('dragging');
  if(dragSrc.day === 'unplanned'){
    draggingFromUnplanned = true;
    document.getElementById('overlay').classList.add('drag-fade');
  }
}
function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  if(draggingFromUnplanned){
    draggingFromUnplanned = false;
    document.getElementById('overlay').classList.remove('drag-fade');
    const board = ensureUnplanned(getBoard());
    if(board.unplanned.length > 0){
      openUnplannedModal();
    } else {
      closeModal();
    }
  }
}
function onDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('dragover'); }
function onDragLeave(e){ e.currentTarget.classList.remove('dragover'); }
function onDrop(e){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const targetDay = e.currentTarget.dataset.day;
  if(!dragSrc) return;
  const board = getBoard();
  const [moved] = board[dragSrc.day].splice(dragSrc.idx, 1);
  board[targetDay].push(moved);
  saveBoard(board);
  dragSrc = null;
  renderBoard();
}
function onItemDragOver(e){
  e.preventDefault();
  e.stopPropagation();
}
function onItemDrop(e, targetDay, targetIdx, targetGroupKey){
  e.preventDefault();
  e.stopPropagation();
  if(!dragSrc) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const insertBefore = (e.clientY - rect.top) < (rect.height / 2);

  const board = getBoard();
  const [moved] = board[dragSrc.day].splice(dragSrc.idx, 1);
  if(targetGroupKey) moved.period = targetGroupKey;

  let insertAt = targetIdx;
  if(dragSrc.day === targetDay && dragSrc.idx < targetIdx){
    insertAt = targetIdx - 1;
  }
  if(!insertBefore) insertAt += 1;

  board[targetDay].splice(insertAt, 0, moved);
  saveBoard(board);
  dragSrc = null;
  renderBoard();
}
function deleteBoardItem(day, idx){
  const board = getBoard();
  board[day].splice(idx, 1);
  saveBoard(board);
  renderBoard();
}

/* ================= Kalender-Text-Import ================= */
function openImportModal(){
  openModal(`
    <h2>Aus Kalender importieren</h2>
    <p style="color:var(--text-dim); font-size:13px; margin:6px 0 16px;">
      Kopiere Termine aus Apple Kalender (Titel + "Geplant: TT.MM.JJJJ, HH:MM bis HH:MM") und füge sie hier ein.
      Mehrere Termine funktionieren gleichzeitig. Achtung: Nur eine Woche gleichzeitig – bei mehreren Kalenderwochen
      landen unterschiedliche Wochen auf demselben Wochentag-Platz.
    </p>
    <textarea class="import-textarea" id="import_text" placeholder="Text hier einfügen..."></textarea>
    <button class="modal-submit" onclick="runImport()">Importieren</button>
  `);
}
function parseImportText(text){
  const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(b => b);
  const results = [];
  blocks.forEach(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(l => l);
    if(lines.length < 2) return;
    const title = lines[0];
    const planLine = lines.find(l => l.startsWith('Geplant:'));
    if(!planLine) return;
    const m = planLine.match(/Geplant:\s*(\d{2})\.(\d{2})\.(\d{4})(?:,\s*(\d{2}):(\d{2})\s*bis\s*(\d{2}):(\d{2}))?/);
    if(!m) return;
    const [, dd, mm, yyyy, sh, sm, eh, em] = m;
    const dateObj = new Date(parseInt(yyyy), parseInt(mm) - 1, parseInt(dd));
    const dayIdx = (dateObj.getDay() + 6) % 7;
    const day = DAYS[dayIdx];
    let time = '', duration = null;
    if(sh !== undefined){
      time = `${sh}:${sm}`;
      const startMin = parseInt(sh) * 60 + parseInt(sm);
      const endMin = parseInt(eh) * 60 + parseInt(em);
      duration = endMin - startMin;
      if(duration <= 0) duration = null;
    }
    results.push({ title, day, time, duration, dateLabel: `${dd}.${mm}.${yyyy}` });
  });
  return results;
}
function runImport(){
  const text = document.getElementById('import_text').value;
  const parsed = parseImportText(text);
  if(parsed.length === 0){
    openModal(`
      <h2>Aus Kalender importieren</h2>
      <p style="color:#ff6b6b; font-size:13px; margin:6px 0 16px;">Konnte keine Termine im eingefügten Text erkennen. Format prüfen und nochmal versuchen.</p>
      <button class="tpl-back" onclick="openImportModal()">← Zurück</button>
    `);
    return;
  }
  const board = getBoard();
  parsed.forEach(p => {
    const newItem = { text: p.title, time: p.time, category: 'termine', priority: null, period: null, recurring: false, done: false };
    if(p.duration) newItem.duration = p.duration;
    insertSorted(board[p.day], newItem);
  });
  saveBoard(board);

  const summary = parsed.map(p => `<li>${escapeHtml(p.title)} – ${p.day} (${p.dateLabel})${p.time ? ' um ' + p.time : ''}</li>`).join('');
  openModal(`
    <h2>Importiert</h2>
    <p style="color:var(--teal); font-size:13px; margin:6px 0 12px;">${parsed.length} Termin(e) übernommen:</p>
    <ul style="font-size:13px; color:var(--text-dim); padding-left:18px; line-height:1.7;">${summary}</ul>
    <button class="modal-submit" style="margin-top:16px;" onclick="closeModal()">Fertig</button>
  `);
  renderBoard();
}

  el.classList.add('selected');
  const cat = catByKey(key);
  el.style.background = `var(--${cat.color})`;
  el.style.color = '#0d0f22';
}
function pickModalPriority(key, el){
  if(modalSelectedPriority === key){
    modalSelectedPriority = null;
    el.classList.remove('selected');
  } else {
    modalSelectedPriority = key;
    document.querySelectorAll('#modal_prio_picker .prio-chip').forEach(chip => chip.classList.remove('selected'));
    el.classList.add('selected');
  }
}
function insertSorted(dayArray, newItem){
  if(!newItem.time){ dayArray.push(newItem); return; }
  let insertAt = dayArray.length;
  for(let i = 0; i < dayArray.length; i++){
    const existing = dayArray[i];
    const existingTime = (typeof existing === 'string') ? '' : (existing.time || '');
    if(existingTime && existingTime.localeCompare(newItem.time) > 0){
      insertAt = i;
      break;
    }
  }
  dayArray.splice(insertAt, 0, newItem);
}
function submitAddModal(){
  const textEl = document.getElementById('modal_text');
  const timeEl = document.getElementById('modal_time');
  const durationEl = document.getElementById('modal_duration');
  const recurEl = document.getElementById('modal_recurring');
  const routineEl = document.getElementById('modal_routine');
  const text = textEl.value.trim();
  if(!text) return;
  const time = timeEl.value || '';
  const duration = durationEl && durationEl.value ? parseInt(durationEl.value, 10) : null;
  const recurring = recurEl.checked;
  const routine = routineEl ? routineEl.checked : false;

  if(modalTargetBucket){
    const newItem = {text, time, category: modalSelectedCategory, recurring, routine, priority: modalSelectedPriority, period: modalSelectedPeriod, done: false};
    if(duration) newItem.duration = duration;
    if(modalSelectedTemplate){
      newItem.templateId = modalSelectedTemplate.id;
      newItem.stepIndex = 0;
    }
    const board = ensureBuckets(getBoard());
    board[modalTargetBucket].push(newItem);
    saveBoard(board);
    const bucket = modalTargetBucket;
    modalTargetBucket = null;
    closeModal();
    if(bucket === 'todos') openTodoModal(); else openUnplannedModal();
    return;
  }

  if(modalSelectedDays.length === 0) return;
  const board = getBoard();
  modalSelectedDays.forEach(day => {
    const newItem = {text, time, category: modalSelectedCategory, recurring, routine, priority: modalSelectedPriority, period: modalSelectedPeriod, done: false};
    if(duration) newItem.duration = duration;
    if(modalSelectedTemplate){
      newItem.templateId = modalSelectedTemplate.id;
      newItem.stepIndex = 0;
    }
    insertSorted(board[day], newItem);
  });
  saveBoard(board);
  closeModal();
  renderBoard();
}

/* ================= Editier-Modal ================= */
let editDay = null;
let editIdx = null;

function openEditModal(day, idx){
  const board = getBoard();
  const raw = board[day][idx];
  const item = (typeof raw === 'string') ? {text: raw} : raw;
  editDay = day;
  editIdx = idx;
  modalSelectedCategory = item.category || CATEGORIES[0].key;
  modalSelectedPriority = item.priority || null;
  modalSelectedPeriod = item.period || null;

  const tpl = item.templateId ? templatesCache.find(t => t.id === item.templateId) : null;
  const displayText = getDisplayText(item);
  const tplInfo = tpl
    ? `<p class="tpl-info">Teil der Vorlage "${escapeHtml(tpl.name)}" – Schritt ${Math.min((item.stepIndex||0)+1, tpl.steps.length)}/${tpl.steps.length}. Text ändern löst die Vorlagen-Verknüpfung.</p>`
    : '';

  const catChips = CATEGORIES.map((c) => `
    <div class="cat-chip ${c.key === modalSelectedCategory ? 'selected' : ''}"
      style="${c.key === modalSelectedCategory ? `background:var(--${c.color});color:#0d0f22;` : `color:var(--${c.color});`} border-color:var(--${c.color});"
      data-key="${c.key}" onclick="pickModalCategory('${c.key}', this)">${c.label}</div>
  `).join('');
  const prioChips = PRIORITIES.map(p => `
    <div class="prio-chip ${p.key === modalSelectedPriority ? 'selected' : ''}" data-key="${p.key}" onclick="pickModalPriority('${p.key}', this)">
      <span class="prio-dot ${p.key}"></span>${p.label}
    </div>
  `).join('');
  const periodChips = TIME_GROUPS.filter(g => g.always).map(g => `
    <div class="day-chip ${g.key === modalSelectedPeriod ? 'selected' : ''}" data-key="${g.key}" onclick="pickModalPeriod('${g.key}', this)">${g.label}</div>
  `).join('');

  openModal(`
    <h2>Eintrag bearbeiten</h2>
    ${tplInfo}
    <div class="modal-field">
      <label>Was steht an?</label>
      <input type="text" class="modal-input" id="modal_text" value="${escapeHtml(displayText || '')}">
    </div>
    <div class="modal-field">
      <label>Uhrzeit (optional)</label>
      <input type="time" class="modal-input" id="modal_time" value="${item.time || ''}">
    </div>
    <div class="modal-field">
      <label>Dauer in Minuten (optional, für Zeitplan-Ansicht)</label>
      <input type="number" class="modal-input" id="modal_duration" value="${item.duration || ''}" placeholder="z.B. 30" min="5" step="5">
    </div>
    <div class="modal-field">
      <label>Tageszeit (optional, unabhängig von Uhrzeit)</label>
      <div class="day-chip-picker" id="modal_period_picker">${periodChips}</div>
    </div>
    <div class="modal-field">
      <label>Kategorie</label>
      <div class="cat-picker" id="modal_cat_picker">${catChips}</div>
    </div>
    <div class="modal-field">
      <label>Dringlichkeit (optional)</label>
      <div class="prio-picker" id="modal_prio_picker">${prioChips}</div>
    </div>
    <div class="modal-field">
      <label class="recur-toggle"><input type="checkbox" id="modal_recurring" ${item.recurring ? 'checked' : ''}> Wiederkehrend (nur Symbol, ändert das Verhalten aktuell nicht)</label>
    </div>
    <div class="modal-field">
      <label class="recur-toggle"><input type="checkbox" id="modal_routine" ${item.routine ? 'checked' : ''}> Routine (tägliche Muss-Sache – wird an kommenden Tagen minimiert angezeigt)</label>
    </div>
    <button class="modal-submit" onclick="submitEditModal()">Speichern</button>
    <button class="modal-delete" onclick="deleteFromEditModal()">Löschen</button>
  `);
  setTimeout(() => { const el = document.getElementById('modal_text'); if(el) el.focus(); }, 50);
}
function submitEditModal(){
  const textEl = document.getElementById('modal_text');
  const timeEl = document.getElementById('modal_time');
  const durationEl = document.getElementById('modal_duration');
  const recurEl = document.getElementById('modal_recurring');
  const text = textEl.value.trim();
  if(!text || editDay === null) return;
  const board = getBoard();
  const existing = board[editDay][editIdx];
  const existingObj = (typeof existing === 'object') ? existing : {};
  const done = existingObj.done || false;

  const originalDisplayText = getDisplayText(existingObj);
  const textWasChanged = text !== originalDisplayText;
  const keepTemplate = existingObj.templateId && !textWasChanged;

  const updated = {
    text,
    time: timeEl.value || '',
    category: modalSelectedCategory,
    priority: modalSelectedPriority,
    period: modalSelectedPeriod,
    recurring: recurEl.checked,
    routine: document.getElementById('modal_routine') ? document.getElementById('modal_routine').checked : false,
    done
  };
  if(durationEl && durationEl.value) updated.duration = parseInt(durationEl.value, 10);
  if(keepTemplate){
    updated.templateId = existingObj.templateId;
    updated.stepIndex = existingObj.stepIndex || 0;
  }
  board[editDay][editIdx] = updated;
  saveBoard(board);
  editDay = null; editIdx = null;
  closeModal();
  renderBoard();
}
function deleteFromEditModal(){
  if(editDay === null) return;
  deleteBoardItem(editDay, editIdx);
  editDay = null; editIdx = null;
  closeModal();
}

/* ================= Post-its ================= */
const POSTIT_COLORS = ['#f5e6a3', '#f7c6d9', '#b9ece0', '#c9d9f7', '#f7d9b9'];

let postitsCache = [];

function getPostIts(){
  return postitsCache;
}
function savePostIts(list){
  postitsCache = list;
  db.collection('wochendashboard').doc('postits').set({ data: list }).catch(e => console.error('Speichern fehlgeschlagen:', e));
}
db.collection('wochendashboard').doc('postits').onSnapshot(doc => {
  postitsCache = (doc.exists && doc.data().data) ? doc.data().data : [];
  renderPostIts();
}, err => console.error('Firestore-Fehler (Post-its):', err));

let notesSaveTimer = null;
let notesFocused = false;

function addPostIt(){
  const list = getPostIts();
  const id = 'p' + Date.now();
  const offset = (list.length % 6) * 24;
  list.push({
    id,
    x: 60 + offset,
    y: 100 + offset,
    width: 220,
    height: 220,
    color: POSTIT_COLORS[list.length % POSTIT_COLORS.length],
    drawing: null
  });
  savePostIts(list);
  renderPostIts();
}
function deletePostIt(id){
  const list = getPostIts().filter(p => p.id !== id);
  savePostIts(list);
  renderPostIts();
}

let postitDrag = null;
let postitResize = null;

function renderPostIts(){
  const layer = document.getElementById('postit_layer');
  const list = getPostIts();
  layer.innerHTML = list.map(p => `
    <div class="postit" id="${p.id}" style="left:${p.x}px; top:${p.y}px; width:${p.width||220}px; height:${p.height||220}px; background:${p.color};">
      <div class="postit-handle" data-id="${p.id}" onpointerdown="startPostitDrag(event,'${p.id}')">
        <button class="postit-del" onclick="deletePostIt('${p.id}')">✕</button>
      </div>
      <canvas class="postit-canvas" id="canvas_${p.id}" data-id="${p.id}"></canvas>
      <div class="postit-resize" data-id="${p.id}" onpointerdown="startPostitResize(event,'${p.id}')"></div>
    </div>
  `).join('');

  list.forEach(p => {
    const canvas = document.getElementById('canvas_' + p.id);
    if(!canvas) return;
    setupCanvas(canvas, p);
  });
}
function setupCanvas(canvas, p){
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * (window.devicePixelRatio || 1);
  canvas.height = rect.height * (window.devicePixelRatio || 1);
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if(p.drawing){
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = p.drawing;
  }

  let drawing = false;
  canvas.addEventListener('pointerdown', (e) => {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    const r = canvas.getBoundingClientRect();
    ctx.beginPath();
    ctx.moveTo(e.clientX - r.left, e.clientY - r.top);
  });
  canvas.addEventListener('pointermove', (e) => {
    if(!drawing) return;
    const r = canvas.getBoundingClientRect();
    ctx.lineTo(e.clientX - r.left, e.clientY - r.top);
    ctx.stroke();
  });
  canvas.addEventListener('pointerup', () => {
    if(!drawing) return;
    drawing = false;
    const dataUrl = canvas.toDataURL('image/png');
    const all = getPostIts();
    const note = all.find(n => n.id === p.id);
    if(note){ note.drawing = dataUrl; savePostIts(all); }
  });
}

function startPostitDrag(e, id){
  const el = document.getElementById(id);
  const rect = el.getBoundingClientRect();
  postitDrag = { id, offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
  document.addEventListener('pointermove', onPostitDragMove);
  document.addEventListener('pointerup', onPostitDragEnd);
}
function onPostitDragMove(e){
  if(!postitDrag) return;
  const el = document.getElementById(postitDrag.id);
  if(!el) return;
  el.style.left = (e.clientX - postitDrag.offsetX) + 'px';
  el.style.top = (e.clientY - postitDrag.offsetY) + 'px';
}
function onPostitDragEnd(e){
  if(!postitDrag) return;
  const list = getPostIts();
  const note = list.find(n => n.id === postitDrag.id);
  if(note){
    note.x = e.clientX - postitDrag.offsetX;
    note.y = e.clientY - postitDrag.offsetY;
    savePostIts(list);
  }
  postitDrag = null;
  document.removeEventListener('pointermove', onPostitDragMove);
  document.removeEventListener('pointerup', onPostitDragEnd);
}

/* ---- Post-it Resize ---- */
const POSTIT_MIN = 120, POSTIT_MAX = 480;
function startPostitResize(e, id){
  e.stopPropagation();
  const el = document.getElementById(id);
  postitResize = { id, startX: e.clientX, startY: e.clientY, startW: el.offsetWidth, startH: el.offsetHeight };
  document.addEventListener('pointermove', onPostitResizeMove);
  document.addEventListener('pointerup', onPostitResizeEnd);
}
function onPostitResizeMove(e){
  if(!postitResize) return;
  const el = document.getElementById(postitResize.id);
  if(!el) return;
  let w = postitResize.startW + (e.clientX - postitResize.startX);
  let h = postitResize.startH + (e.clientY - postitResize.startY);
  w = Math.min(POSTIT_MAX, Math.max(POSTIT_MIN, w));
  h = Math.min(POSTIT_MAX, Math.max(POSTIT_MIN, h));
  el.style.width = w + 'px';
  el.style.height = h + 'px';
}
function onPostitResizeEnd(e){
  if(!postitResize) return;
  const el = document.getElementById(postitResize.id);
  const list = getPostIts();
  const note = list.find(n => n.id === postitResize.id);
  if(note && el){
    note.width = el.offsetWidth;
    note.height = el.offsetHeight;
    savePostIts(list);
  }
  postitResize = null;
  document.removeEventListener('pointermove', onPostitResizeMove);
  document.removeEventListener('pointerup', onPostitResizeEnd);
  renderPostIts();
}

/* ================= Zeitplan-Ansicht ================= */
const TL_START = 8;
const TL_END = 23;
const TL_PPH = 56; // Pixel pro Stunde
let boardViewMode = 'list';
let currentTlDay = null;

function timeToMinutes(t){
  if(!t) return null;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function minutesToTime(min){
  const h = Math.floor(min / 60).toString().padStart(2, '0');
  const m = Math.floor(min % 60).toString().padStart(2, '0');
  return `${h}:${m}`;
}
function switchBoardView(view){
  boardViewMode = view;
  document.getElementById('view_list_btn').classList.toggle('active', view === 'list');
  document.getElementById('view_tl_btn').classList.toggle('active', view === 'timeline');
  document.getElementById('board_grid').style.display = view === 'list' ? 'grid' : 'none';
  document.getElementById('tl_view').style.display = view === 'timeline' ? 'block' : 'none';
  if(view === 'timeline'){
    if(!currentTlDay) currentTlDay = DAYS[dowIndex()];
    renderTimelineView();
  }
}
function switchTlDay(day){
  currentTlDay = day;
  renderTimelineView();
}
function renderTimelineView(){
  if(!currentTlDay) currentTlDay = DAYS[dowIndex()];
  const totalHeight = (TL_END - TL_START) * TL_PPH;

  const tabsHtml = DAYS.map(d => `
    <div class="tl-day-tab ${d === currentTlDay ? 'active' : ''}" onclick="switchTlDay('${d}')">${d}</div>
  `).join('');
  document.getElementById('tl_day_tabs').innerHTML = tabsHtml;

  const board = getBoard();
  const rawItems = (board[currentTlDay] || []).map((it, origIdx) => {
    const obj = (typeof it === 'string') ? {text: it} : it;
    return Object.assign({}, obj, {origIdx});
  });
  const timed = rawItems.filter(it => it.time);
  const untimed = rawItems.filter(it => !it.time);

  let gutterHtml = '';
  let linesHtml = '';
  for(let h = TL_START; h <= TL_END; h++){
    const top = (h - TL_START) * TL_PPH;
    gutterHtml += `<div class="tl-hour-label" style="top:${top}px;">${h}</div>`;
    if(h < TL_END){
      linesHtml += `<div class="tl-hour-line" style="top:${top}px;"></div>`;
    }
  }
  document.getElementById('tl_gutter').innerHTML = gutterHtml;
  document.getElementById('tl_gutter').style.height = totalHeight + 'px';

  const itemsHtml = timed.map(obj => {
    let startMin = timeToMinutes(obj.time);
    startMin = Math.max(TL_START*60, Math.min(TL_END*60 - 15, startMin));
    const top = (startMin - TL_START * 60) / 60 * TL_PPH;
    const dur = obj.duration || 30;
    const height = Math.max(26, dur / 60 * TL_PPH);
    const cat = catByKey(obj.category);
    const borderColor = cat ? `var(--${cat.color})` : 'var(--blue)';
    const displayText = getDisplayText(obj);
    return `
      <div class="tl-item ${obj.done ? 'done' : ''}" data-day="${currentTlDay}" data-idx="${obj.origIdx}"
        style="top:${top}px; height:${height}px; border-left-color:${borderColor};">
        <div class="tl-item-body" onpointerdown="tlPointerDown(event,'${currentTlDay}',${obj.origIdx},'move')">
          <span class="tl-item-time">${obj.time}</span>${escapeHtml(displayText)}
        </div>
        <div class="tl-resize-handle" onpointerdown="tlPointerDown(event,'${currentTlDay}',${obj.origIdx},'resize')"></div>
      </div>
    `;
  }).join('');

  const dayCol = document.getElementById('tl_day_col');
  dayCol.style.height = totalHeight + 'px';
  dayCol.innerHTML = linesHtml + itemsHtml;

  const untimedEl = document.getElementById('tl_untimed');
  untimedEl.innerHTML = untimed.length
    ? untimed.map(obj => renderItemHtml(obj, currentTlDay)).join('')
    : '<p class="muted-note">Keine Einträge ohne Uhrzeit.</p>';
}

let tlDrag = null;
function tlPointerDown(e, day, idx, mode){
  e.stopPropagation();
  e.preventDefault();
  const board = getBoard();
  const raw = board[day][idx];
  const item = (typeof raw === 'string') ? {text: raw} : raw;
  const startMinutes = timeToMinutes(item.time) || (TL_START * 60);
  tlDrag = {
    day, idx, mode,
    startY: e.clientY,
    startTopMin: startMinutes,
    startDuration: item.duration || 30,
    moved: false,
    liveMinutes: null,
    liveDuration: null
  };
  document.addEventListener('pointermove', tlPointerMove);
  document.addEventListener('pointerup', tlPointerUp);
}
function tlPointerMove(e){
  if(!tlDrag) return;
  const deltaY = e.clientY - tlDrag.startY;
  if(Math.abs(deltaY) > 4) tlDrag.moved = true;
  const el = document.querySelector(`.tl-item[data-day="${tlDrag.day}"][data-idx="${tlDrag.idx}"]`);
  if(!el) return;
  if(tlDrag.mode === 'move'){
    const deltaMin = (deltaY / TL_PPH) * 60;
    let newTop = tlDrag.startTopMin + deltaMin;
    newTop = Math.max(TL_START*60, Math.min(TL_END*60 - 15, newTop));
    const snapped = Math.round(newTop / 15) * 15;
    el.style.top = ((snapped - TL_START*60) / 60 * TL_PPH) + 'px';
    tlDrag.liveMinutes = snapped;
  } else {
    const deltaMin = (deltaY / TL_PPH) * 60;
    let newDur = tlDrag.startDuration + deltaMin;
    newDur = Math.max(15, Math.min(TL_END*60 - tlDrag.startTopMin, newDur));
    const snapped = Math.round(newDur / 15) * 15;
    el.style.height = Math.max(26, snapped / 60 * TL_PPH) + 'px';
    tlDrag.liveDuration = snapped;
  }
}
function tlPointerUp(e){
  if(!tlDrag) return;
  document.removeEventListener('pointermove', tlPointerMove);
  document.removeEventListener('pointerup', tlPointerUp);
  const { day, idx, mode, moved, liveMinutes, liveDuration } = tlDrag;
  tlDrag = null;

  if(!moved){
    handleItemTap({}, day, idx);
    return;
  }
  const board = getBoard();
  let item = board[day][idx];
  if(typeof item === 'string'){ item = {text: item}; board[day][idx] = item; }
  if(mode === 'move' && liveMinutes != null){
    item.time = minutesToTime(liveMinutes);
  } else if(mode === 'resize' && liveDuration != null){
    item.duration = liveDuration;
  }
  saveBoard(board);
  renderTimelineView();
}

/* ================= Start ================= */
renderBoard();
renderPostIts();
